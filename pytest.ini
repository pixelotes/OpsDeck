[pytest]
# Le dice a pytest que busque los módulos de python aquí
pythonpath = . src
addopts = --ignore=opsdeck-enterprise
filterwarnings =
    default
    ignore:Identity map already had an identity:sqlalchemy.exc.SAWarning
    ignore::ResourceWarning
    # The demo seeder wires relationships before flushing; the cascade it skips is
    # applied explicitly elsewhere. Pre-existing, and 200+ lines of noise per run.
    ignore:Object of type:sqlalchemy.exc.SAWarning