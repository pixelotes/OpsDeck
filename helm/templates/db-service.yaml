{{- if eq .Values.database.type "internal" -}}
{{- if not .Values.postgresql.enabled -}}
{{- fail "database.type=internal needs the bundled PostgreSQL: set postgresql.enabled=true (or use database.type=external)" -}}
{{- end -}}
# Stable in-cluster name for the bundled PostgreSQL (Bitnami subchart). The
# selector targets the subchart's primary pod, whose labels are set by the
# subchart, not by this chart.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opsdeck.fullname" . }}-db
  labels:
    {{- include "opsdeck.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app.kubernetes.io/name: {{ .Values.postgresql.nameOverride | default "postgresql" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: primary
{{- end }}