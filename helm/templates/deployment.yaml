apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opsdeck.fullname" . }}
  labels:
    {{- include "opsdeck.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Recreate: termina el pod antiguo antes de crear el nuevo.
  # Necesario porque los volúmenes (PVC) son ReadWriteOnce y no se pueden
  # compartir entre dos pods a la vez durante un RollingUpdate.
  # Implica unos segundos/minutos de downtime en cada actualización.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "opsdeck.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "opsdeck.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          
          env:
            # --- 1. Base de datos (ver opsdeck.databaseEnv en _helpers.tpl) ---
            {{- include "opsdeck.databaseEnv" . | nindent 12 }}

            # --- Session signing key (see secretKey in values.yaml) ---
            # Skipped when existingSecret is set: that secret is expected to carry SECRET_KEY.
            {{- if not .Values.existingSecret }}
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretKey.existingSecret.name | default (printf "%s-secret-key" (include "opsdeck.fullname" .)) }}
                  key: {{ .Values.secretKey.existingSecret.key | default "SECRET_KEY" }}
            {{- end }}
            
            # --- 2. Variables de Entorno Extra (values.yaml) ---
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}

          # --- 3. Secretos Externos ---
          {{- if .Values.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          {{- end }}

          # --- 4. Health Checks ---
          # /health answers 200 without authentication and is exempt from the HTTPS
          # redirect, so it can be probed over plain HTTP inside the cluster. A listening
          # socket is not health: a worker that cannot serve a request still had one.
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 60      # migrations and seeding run before gunicorn: up to 5 min
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          # --- 5. Montaje de Volúmenes ---
          volumeMounts:
            # Logs folder
            {{- if .Values.persistence.logs.enabled }}
            - name: logs
              mountPath: /app/logs
            {{- end }}
            
            # Attachments folder
            {{- if .Values.persistence.attachments.enabled }}
            - name: attachments
              mountPath: /app/data/attachments
            {{- end }}

        # --- 5.1 Logging Sidecar ---
        {{- if .Values.loggingSidecar.enabled }}
        - name: filebeat-sidecar
          image: "{{ .Values.loggingSidecar.image.repository }}:{{ .Values.loggingSidecar.image.tag }}"
          imagePullPolicy: {{ .Values.loggingSidecar.image.pullPolicy }}
          args: [
            "-c", "/usr/share/filebeat/filebeat.yml",
            "-e",
          ]
          env:
            - name: ELASTICSEARCH_HOST
              value: "{{ .Values.loggingSidecar.elasticsearch.host }}"
            - name: ELASTICSEARCH_PORT
              value: "{{ .Values.loggingSidecar.elasticsearch.port }}"
            - name: ELASTICSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.loggingSidecar.elasticsearch.existingSecret }}
                  key: ELASTICSEARCH_USERNAME
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.loggingSidecar.elasticsearch.existingSecret }}
                  key: ELASTICSEARCH_PASSWORD
          volumeMounts:
            - name: logging-config
              mountPath: /usr/share/filebeat/filebeat.yml
              subPath: filebeat.yml
              readOnly: true
            - name: logs
              mountPath: /app/logs
              readOnly: true
        {{- end }}

      # --- 6. Definición de Volúmenes ---
      volumes:
        # Logs PVC
        {{- if .Values.persistence.logs.enabled }}
        - name: logs
          persistentVolumeClaim:
            {{- if .Values.persistence.logs.existingClaim }}
            claimName: {{ .Values.persistence.logs.existingClaim }}
            {{- else }}
            claimName: {{ include "opsdeck.fullname" . }}-logs-pvc
            {{- end }}
        {{- end }}
        
        # Attachments PVC
        {{- if .Values.persistence.attachments.enabled }}
        - name: attachments
          persistentVolumeClaim:
            {{- if .Values.persistence.attachments.existingClaim }}
            claimName: {{ .Values.persistence.attachments.existingClaim }}
            {{- else }}
            claimName: {{ include "opsdeck.fullname" . }}-attachments-pvc
            {{- end }}
        {{- end }}

        # Logging Sidecar Config Map
        {{- if .Values.loggingSidecar.enabled }}
        - name: logging-config
          configMap:
            name: {{ include "opsdeck.fullname" . }}-logging-config
        {{- end }}


