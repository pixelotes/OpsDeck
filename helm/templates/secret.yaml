{{- /*
Session signing key, generated once and kept across upgrades.

Rendered only when nothing else provides SECRET_KEY: neither `existingSecret` (whose
contents are loaded wholesale) nor `secretKey.existingSecret`. A fresh random value on
every `helm upgrade` would log every user out and invalidate every open form, so an
existing Secret is looked up and its value reused.
*/ -}}
{{- if and (not .Values.existingSecret) (not .Values.secretKey.existingSecret.name) }}
{{- $name := printf "%s-secret-key" (include "opsdeck.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $value := .Values.secretKey.value }}
{{- if and (not $value) $existing (index $existing.data "SECRET_KEY") }}
{{- $value = index $existing.data "SECRET_KEY" | b64dec }}
{{- end }}
{{- if not $value }}
{{- $value = randAlphaNum 64 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "opsdeck.labels" . | nindent 4 }}
  annotations:
    # Keep the key when the release is deleted and reinstalled with the same name.
    helm.sh/resource-policy: keep
type: Opaque
data:
  SECRET_KEY: {{ $value | b64enc | quote }}
{{- end }}
