{{- if .Values.backup.enabled -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "opsdeck.fullname" . }}-backup
  labels:
    {{- include "opsdeck.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "opsdeck.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          {{- if or .Values.backup.serviceAccount.create .Values.backup.serviceAccount.name }}
          serviceAccountName: {{ .Values.backup.serviceAccount.name | default (printf "%s-backup" (include "opsdeck.fullname" .)) }}
          {{- end }}
          containers:
            - name: backup
              image: "{{ .Values.backup.image.repository }}:{{ .Values.backup.image.tag }}"
              command: ["sh", "/scripts/backup.sh"]
              env:
                # --- Database connection (same Secret-backed URL as the app) ---
                {{- include "opsdeck.databaseEnv" . | nindent 16 }}
                # --- Restic config (from user-managed Secret) ---
                - name: RESTIC_REPOSITORY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.existingSecret }}
                      key: RESTIC_REPOSITORY
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.existingSecret }}
                      key: RESTIC_PASSWORD
                {{- if not .Values.backup.aws.useIRSA }}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.existingSecret }}
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.existingSecret }}
                      key: AWS_SECRET_ACCESS_KEY
                {{- end }}
                {{- with .Values.backup.aws.region }}
                - name: AWS_DEFAULT_REGION
                  value: {{ . | quote }}
                {{- end }}
              volumeMounts:
                - name: backup-script
                  mountPath: /scripts
                  readOnly: true
                - name: files
                  mountPath: /backup/files
                  readOnly: true
                - name: database-staging
                  mountPath: /backup/database
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
          volumes:
            - name: backup-script
              configMap:
                name: {{ include "opsdeck.fullname" . }}-backup-script
                defaultMode: 0755
            - name: files
              persistentVolumeClaim:
                {{- if .Values.persistence.attachments.existingClaim }}
                claimName: {{ .Values.persistence.attachments.existingClaim }}
                {{- else }}
                claimName: {{ include "opsdeck.fullname" . }}-attachments-pvc
                {{- end }}
            - name: database-staging
              emptyDir: {}
{{- end -}}
