# --- Configuración de la App ---
image:
  repository: pixelotes/opsdeck  # Cambia esto por tu imagen real
  # "latest" con IfNotPresent nunca vuelve a descargar en un nodo que ya la tenga.
  # Si fijas un tag de versión puedes volver a IfNotPresent.
  pullPolicy: Always
  tag: "latest"

# --- Seguridad del pod ---
# La imagen corre como el usuario opsdeck (uid 1000). fsGroup hace que los PVC montados
# (logs, adjuntos) sean escribibles por ese usuario.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

service:
  type: ClusterIP
  port: 5000

# --- Base de Datos ---
database:
  # Opciones: "internal" (el subchart de PostgreSQL de Bitnami, ver .Values.postgresql;
  # requiere postgresql.enabled: true) o "external" (RDS, Aurora, etc.)
  type: internal

  # Solo se usa si type: external
  external:
    host: "mi-aurora-db.aws.com"
    port: 5432
    username: "admin"
    database: "opsdeck_prod"
    existingSecret:
      name: "secreto-kubernetes"
      key: "password"

# --- Persistent Storage for Application Data ---
persistence:
  # Logs storage (logs folder)
  logs:
    enabled: true
    size: 500Mi
    storageClass: ""
    # If you want to use an existing PVC instead of creating a new one
    existingClaim: ""
  
  # Attachments storage (data/attachments folder)
  attachments:
    enabled: true
    size: 5Gi
    storageClass: ""
    # If you want to use an existing PVC instead of creating a new one
    existingClaim: ""

# --- Configuración PostgreSQL Interna (Bitnami Subchart) ---
# Se activa automáticamente si database.type es "internal" (ver lógica abajo no, se controla manual)
# Para usar externa, pon enabled: false
postgresql:
  enabled: false
  auth:
    username: opsdeck
    # Crea tu propia contraseña.
    # No la escribas aquí: este fichero acaba en git y en el estado de Helm. Opciones:
    #   - Déjala vacía: el subchart genera una aleatoria en la primera instalación y la
    #     guarda en el Secret <release>-postgresql (clave "password"); la app y el backup
    #     la leen de ahí.
    #   - O crea tú un Secret con la clave "password" y pon su nombre en existingSecret.
    password: ""
    existingSecret: ""
    secretKeys:
      userPasswordKey: password
    database: opsdeck_db
  # Persistencia de la BBDD interna (puedes desactivarla si quieres que sea efímera)
  primary:
    persistence:
      enabled: true
      size: 1Gi

# --- Exposición (Ingress vs Gateway API) ---
ingress:
  enabled: false
  className: "nginx"
  host: "opsdeck.local"
  tls: []
  #  - secretName: opsdeck-tls
  #    hosts:
  #      - opsdeck.local

gatewayApi:
  enabled: false
  gatewayName: "my-gateway"  # El nombre del Gateway existente en tu cluster
  namespace: "default"       # Namespace del Gateway
  hostname: "opsdeck.example.com"

# --- Configuración y Secretos ---
# Variables de entorno extra
env: 
  FLASK_ENV: "production"

# --- Session signing key ---
# The application refuses to start in production without a real SECRET_KEY (it signs
# every session cookie and CSRF token). Three ways to provide it, in order of preference:
#   1. Put SECRET_KEY in the secret named by `existingSecret` below (loaded via envFrom).
#   2. Point `secretKey.existingSecret` at a Secret that holds just the key.
#   3. Leave everything empty: the chart generates a 64-character key on first install
#      and keeps it across upgrades (it is looked up, not regenerated).
# `secretKey.value` sets it in plain text in values; only for throwaway environments.
secretKey:
  existingSecret:
    name: ""
    key: "SECRET_KEY"
  value: ""

# Si tienes un secreto creado manualmente (ej: sealed-secrets o external-secrets)
# pon el nombre aquí. La chart cargará todo el contenido como variables de entorno.
existingSecret: ""

# --- Backup Configuration ---
# CronJob that dumps the database and backs up attachments to a restic repo in S3.
# Credentials can be provided either via a Secret (AWS access keys) or via IRSA on EKS.
backup:
  enabled: false
  schedule: "0 3 * * *"          # Daily at 3 AM
  image:
    repository: pixelotes/opsdeck-backup   # Alpine + postgresql-client + restic
    tag: "latest"
  # Required keys: RESTIC_REPOSITORY, RESTIC_PASSWORD
  # Also required when aws.useIRSA=false: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
  existingSecret: ""
  aws:
    # When true, omit AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY env vars so the
    # AWS SDK (used by restic) picks up the IRSA web identity token injected
    # into the pod by the EKS pod identity webhook. Requires a ServiceAccount
    # annotated with eks.amazonaws.com/role-arn (see serviceAccount below).
    useIRSA: false
    # Optional: sets AWS_DEFAULT_REGION (required by STS for IRSA in some setups)
    region: ""
  serviceAccount:
    # Create a dedicated ServiceAccount for the backup CronJob.
    create: false
    # Name of the ServiceAccount to use. If create=true and empty, defaults to
    # "<release>-backup". If create=false, must point to an existing SA.
    name: ""
    # Annotations applied to the SA. For IRSA on EKS:
    #   eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/<role-name>
    annotations: {}
  retention:
    keepDaily: 7
    keepWeekly: 4
    keepMonthly: 6
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# --- Logging Sidecar Configuration ---
loggingSidecar:
  enabled: false
  image:
    repository: docker.elastic.co/beats/filebeat
    tag: 8.5.1
    pullPolicy: IfNotPresent
  elasticsearch:
    host: "elasticsearch"
    port: 9200
    protocol: "http"
    # Secret containing ELASTICSEARCH_USERNAME and ELASTICSEARCH_PASSWORD keys
    existingSecret: ""
  # Optional: Extra Filebeat config (merged into filebeat.yml)
  config: {}

