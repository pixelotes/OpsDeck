name: CD Release (Docker Hub)

# Se dispara cuando se cierra un PR
on:
  pull_request:
    types: [closed]

jobs:
  # La misma suite que corre en cada PR, otra vez sobre el commit de merge: la imagen
  # sólo se publica si pasa.
  test:
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    uses: ./.github/workflows/ci.yml

  build-and-push:
    # CONDICIÓN:
    # 1. El PR debe haber sido mergeado (merged == true)
    # 2. La rama origen (head.ref) debe empezar por "release/" (ej: release/v0.0.1).
    #    Antes bastaba con que contuviera "release", y una rama feature/release-notes
    #    también publicaba imagen.
    # 3. La suite de tests del paso anterior debe haber pasado.
    needs: test
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')

    runs-on: ubuntu-latest
    steps:
      - name: 1. Clonar el repositorio
        uses: actions/checkout@v6

      - name: 2. Extraer versión de la rama
        id: get_version
        run: |
          # Obtenemos el nombre de la rama, ej: release/v0.0.1
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          
          # Usamos manipulación de strings de bash para quitar el prefijo "release/"
          # Si la rama es "release/v0.0.1", esto devuelve "v0.0.1"
          VERSION=${BRANCH_NAME#release/}
          
          echo "Detectada versión: $VERSION"
          # Guardamos la variable para usarla en el paso de Docker
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: 3. Iniciar sesión en Docker Hub
        uses: docker/login-action@v4
        with:
          # Asegúrate de tener estos secrets configurados en GitHub
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 4. Construir y publicar imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          # Sin target, buildx construye la última etapa del Dockerfile. Cuando la última
          # era `dev`, lo que se publicaba como imagen de producción llevaba pytest, faker
          # y corría como root.
          target: production
          push: true
          # Usamos el output del paso 2 para etiquetar la imagen
          tags: pixelotes/opsdeck:${{ steps.get_version.outputs.VERSION }}