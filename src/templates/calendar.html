{% extends "layout.html" %}
{% block title %}Renewal Calendar - {{ super() }}{% endblock %}

{% block head_extra %}
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/simple-calendar-js/simple-calendar-js.min.css') }}">
<style>
    /* SimpleCalendarJS customization */
    .scjs .scjs-event {
        font-size: 12px;
        line-height: 1.4;
    }
    .scjs-event-title {
        font-weight: bold;
    }
    .scjs-event-cost {
        font-weight: normal;
        opacity: 0.8;
        display: block;
    }
</style>
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-calendar"></i> Renewal Calendar</h2>
    <div>
        <span class="badge bg-primary me-2"><i class="fas fa-sync"></i> Auto Renew</span>
        <span class="badge bg-warning text-dark"><i class="fas fa-hand-paper"></i> Manual Renew</span>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <div id="calendar"></div>
    </div>
</div>
{% endblock %}

{% block scripts_extra %}
<script src="{{ url_for('static', filename='vendor/simple-calendar-js/simple-calendar-js.min.js') }}"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const calendarEl = document.getElementById('calendar');

    // SimpleCalendarJS has no built-in OS/app theme detection; it toggles
    // dark styles purely via the .uc-dark class, so sync it with OpsDeck's theme.
    function syncCalendarTheme() {
        const isDark = document.documentElement.getAttribute('data-bs-theme') === 'dark';
        calendarEl.classList.toggle('uc-dark', isDark);
    }
    syncCalendarTheme();
    window.addEventListener('themechange', syncCalendarTheme);

    const calendar = new SimpleCalendarJs('#calendar', {
        defaultView: 'month',
        locale: 'es-ES',
        fetchEvents: async (startDate, endDate) => {
            // startDate/endDate are JS Date objects; format as YYYY-MM-DD
            // (the backend rejects Date.toString() output like "Wed Nov 01 2025...")
            const start = startDate.toISOString().slice(0, 10);
            const end = endDate.toISOString().slice(0, 10);
            const response = await fetch(`{{ url_for('subscriptions.calendar_events') }}?start=${start}&end=${end}`);
            if (!response.ok) {
                console.error('Failed to fetch calendar events');
                return [];
            }
            const events = await response.json();

            // SimpleCalendarJS reads .color (not backgroundColor) and filters out
            // any event missing .end (t.end >= range.start fails on undefined), so
            // every all-day single-date event needs an explicit end equal to start.
            return events.map(event => ({
                ...event,
                color: event.backgroundColor,
                end: event.start,
                allDay: true
            }));
        },
        onEventClick: (event) => {
            if (event.url) {
                window.location.href = event.url;
            }
        },
        firstDayOfWeek: 1 // Monday as first day of week (EU default)
    });
});
</script>
{% endblock %}
