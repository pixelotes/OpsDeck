<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - OpsDeck</title>
    <!-- FOUC Prevention -->
    <script nonce="{{ csp_nonce() }}">
        (function() {
            var theme = localStorage.getItem('opsdeck-theme') ||
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-bs-theme', theme);
        })();
    </script>
    <link href="{{ url_for('static', filename='vendor/bootstrap/css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='vendor/font-awesome/css/all.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/theme.css') }}" rel="stylesheet">
    <style>
        .login-container {
            max-width: 400px;
            margin: 5rem auto;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="card">
            <div class="card-header text-center">
                <h4><i class="fas fa-shield-alt"></i> OpsDeck</h4>
            </div>
            <div class="card-body">
                {% with messages = get_flashed_messages() %}
                {% if messages %}
                <div class="alert alert-danger">{{ messages[0] }}</div>
                {% endif %}
                {% endwith %}
                <form method="POST" action="{{ url_for('main.login') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>

                {% if config.get('GOOGLE_OAUTH_CLIENT_ID') %}
                <hr class="my-3">
                <a href="{{ url_for('google.login') }}" class="btn btn-danger w-100">
                    <i class="fab fa-google"></i> Iniciar sesión con Google
                </a>
                {% endif %}
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='vendor/bootstrap/js/bootstrap.bundle.min.js') }}"></script>
</body>

</html>
