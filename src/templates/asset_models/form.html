{% extends "layout.html" %}

{% set title = "Edit Model" if model else "New Model" %}

{% block title %}{{ title }} - {{ super() }}{% endblock %}

{% block content %}
<h2><i class="fas fa-cube"></i> {{ title }}</h2>
<hr>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label for="brand_id" class="form-label">Brand *</label>
                <select class="form-select" id="brand_id" name="brand_id" required
                    {% if not can_write('core_inventory') %}disabled{% endif %}>
                    <option value="">-- Select Brand --</option>
                    {% for brand in brands %}
                    <option value="{{ brand.id }}" {% if preselected_brand_id == brand.id %}selected{% endif %}>{{ brand.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label for="name" class="form-label">Name *</label>
                <input type="text" class="form-control" id="name" name="name"
                    value="{{ model.name if model else '' }}" required maxlength="100"
                    {% if not can_write('core_inventory') %}disabled{% endif %}>
            </div>
            <div class="mb-3">
                <label for="notes" class="form-label">Notes</label>
                <textarea class="form-control" id="notes" name="notes" rows="3"
                    {% if not can_write('core_inventory') %}disabled{% endif %}>{{ model.notes if model else '' }}</textarea>
            </div>
            <div class="mt-4">
                <a href="{{ url_for('asset_models.list_models') }}" class="btn btn-secondary">Cancel</a>
                {% if can_write('core_inventory') %}
                <button type="submit" class="btn btn-primary">Save Model</button>
                {% endif %}
            </div>
        </form>
    </div>
</div>
{% endblock %}
